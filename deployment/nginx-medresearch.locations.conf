# Include INSIDE the existing aics.femh.org.tw TLS server block (listen 8443).
# This is not a replacement for the existing voice/chat Nginx configuration.
location = /medresearch {
    return 308 /medresearch/$is_args$args;
}

location ^~ /medresearch/ {
    # Resolve again after container recreation instead of retaining an old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $medresearch_upstream medresearch-app:8000;

    # Strip only the prefix. Uvicorn restores it in ASGI root_path for redirects.
    rewrite ^/medresearch/(.*)$ /$1 break;
    proxy_pass http://$medresearch_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
