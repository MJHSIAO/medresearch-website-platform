# Merge AFTER the existing server docker-compose.yml. See docs/docker-deployment.md.
# Paths are relative to the FIRST Compose file, not this file.
services:
  medresearch-app:
    build:
      context: ${MEDRESEARCH_PROJECT_DIR:-./medresearch-website-platform}
      dockerfile: Dockerfile
    image: ${MEDRESEARCH_IMAGE:-medresearch-website-platform:local}
    env_file:
      - ${MEDRESEARCH_ENV_FILE:-./medresearch-website-platform/.env.docker}
    environment:
      APP_ENV: production
      OIDC_DEBUG_CLAIMS: "false"
      # Trust only the existing reverse proxy's Docker network.
      FORWARDED_ALLOW_IPS: ${VOICE_APP_INTERNAL_SUBNET:-192.168.161.0/24}
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --root-path
      - /medresearch
      - --no-access-log
    expose:
      - "8000"
    networks:
      - app_internal
    read_only: true
    volumes:
      - medresearch-data:/app/var
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped

volumes:
  medresearch-data:
