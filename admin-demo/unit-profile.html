<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="單位基本資料表單 UI Demo。"><title>修改單位介紹｜內容管理 Demo</title>
  <link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/admin.css"><link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="admin-body" data-root=".." data-admin-page="unit-profile">
  <a class="skip-link" href="#admin-main">跳到主要內容</a><header id="admin-header"></header><div class="admin-shell"><aside class="admin-sidebar" id="admin-sidebar"></aside><main class="admin-main" id="admin-main" tabindex="-1"><div class="admin-main-inner">
    <div class="permission-note" id="permission-note"></div><header class="admin-header"><div><span class="eyebrow">單位內容</span><h1>修改單位介紹</h1><p>結構性欄位為唯讀；可編輯內容會同步到單位公開頁面。</p></div><a class="button secondary" href="../ai-center/index.html" target="_blank" rel="noopener">預覽單位網站</a></header>
    <form class="card" id="unit-form" novalidate>
      <div class="form-grid">
        <div class="field"><label for="unit-name">單位名稱</label><input id="unit-name" name="name" readonly><small>由醫研部總管理員或系統管理員維護。</small></div>
        <div class="field"><label for="unit-slug">單位網址代碼</label><input id="unit-slug" name="slug" readonly><small>一般單位管理者不可修改。</small></div>
        <div class="field full"><label for="short-description">單位簡短介紹 <span class="required">必填</span></label><textarea id="short-description" name="short_description" maxlength="150" required></textarea><small>建議 100–150 個中文字；供首頁、單位列表與搜尋結果共用。</small></div>
        <div class="field full"><label for="full-description">單位完整介紹 <span class="required">必填</span></label><textarea id="full-description" name="full_description" required></textarea></div>
        <div class="field full"><label for="purpose">成立宗旨</label><textarea id="purpose" name="purpose"></textarea></div>
        <div class="field"><label for="goals">發展目標</label><textarea id="goals" name="goals"></textarea><small>每行一項。</small></div>
        <div class="field" id="services"><label for="service-items">主要業務／服務項目</label><textarea id="service-items" name="services"></textarea><small>每行一項。</small></div>
        <div class="field"><label for="research-fields">研究方向</label><textarea id="research-fields" name="research_fields"></textarea><small>每行一項。</small></div>
        <div class="field" id="members"><label for="member-items">主管及成員</label><textarea id="member-items" name="members"></textarea><small>每行一項。</small></div>
        <div class="field" id="contact"><label for="contact-person">聯絡窗口 <span class="required">必填</span></label><input id="contact-person" name="contact_person" required></div>
        <div class="field"><label for="contact-phone">聯絡電話</label><input id="contact-phone" name="contact_phone"></div>
        <div class="field"><label for="contact-email">電子郵件</label><input id="contact-email" name="contact_email" type="email"></div>
        <div class="field"><label for="contact-address">地址</label><input id="contact-address" name="contact_address"></div>
        <div class="field"><label for="hero-file">主視覺圖片</label><input id="hero-file" name="hero_file" type="file" accept="image/jpeg,image/png,image/webp"><small>UI Demo 僅顯示瀏覽器端檔案選擇；未上傳至伺服器。</small></div>
        <div class="field"><label for="hero-alt">圖片替代文字 <span class="required">必填</span></label><input id="hero-alt" name="hero_alt" required></div>
        <div class="field"><label for="updated-at">最後更新時間</label><input id="updated-at" name="updated_at" readonly></div>
      </div>
      <div class="callout"><strong>資料保存說明</strong><p>localStorage 只供 UI Demo 使用，不是正式資料庫或權限系統。不得輸入病人資料、個資或院內機密。</p></div>
      <div class="button-row"><button class="button" type="submit">儲存變更</button><a class="button secondary" href="../ai-center/index.html" target="_blank" rel="noopener">預覽</a><a class="button ghost" href="index.html">取消</a></div>
      <p class="status-message" id="unit-save-status" role="status" tabindex="-1" hidden></p>
    </form>
  </div></main></div><script src="../assets/js/data-service.js"></script><script src="../assets/js/admin-demo.js"></script>
</body>
</html>
