<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="圖片與附件瀏覽器端預覽 UI Demo。"><title>圖片與附件｜內容管理 Demo</title>
  <link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/admin.css"><link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="admin-body" data-root=".." data-admin-page="media">
  <a class="skip-link" href="#admin-main">跳到主要內容</a><header id="admin-header"></header><div class="admin-shell"><aside class="admin-sidebar" id="admin-sidebar"></aside><main class="admin-main" id="admin-main" tabindex="-1"><div class="admin-main-inner">
    <div class="permission-note" id="permission-note"></div><header class="admin-header"><div><span class="eyebrow">媒體管理</span><h1>圖片與附件</h1><p>本頁只示範瀏覽器端預覽，沒有正式檔案上傳。</p></div></header>
    <section class="card"><div class="upload-drop"><div class="field"><label for="media-file">選擇圖片或附件</label><input id="media-file" type="file" accept="image/jpeg,image/png,image/webp,.pdf,.doc,.docx"><small>圖片建議 1600×900（16:9），JPG/PNG/WebP；附件示意支援 PDF/DOC/DOCX；上限 5 MB。</small></div><div class="field"><label for="media-alt">圖片替代文字</label><input id="media-alt"><small>使用圖片時必填。不得上傳病人資料、個資或院內機密。</small></div></div><div class="file-preview" id="media-preview" hidden><div><strong data-file-name></strong><br><small data-file-meta></small></div><button class="button danger" id="remove-media" type="button">移除</button></div><img class="image-preview" id="image-preview" alt="" hidden><p class="status-message" id="media-status" role="status" hidden></p></section>
  </div></main></div><script src="../assets/js/data-service.js"></script><script src="../assets/js/admin-demo.js"></script>
</body>
</html>
